name: testing runner
on:
  push:
    branches: 
      - feature/import
jobs:
  display:
    runs-on: self-hosted
    steps:
      - name: checkout the code
        uses: actions/checkout@v4


      - name: setup node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: install maven
        run: |
          sudo apt update
          sudo apt install maven -y
      
      - name: snyk install 
        run: npm install -g snyk
        
        

      - name: run tests
        run: |
             snyk test --file=vprofile-project/pom.xml

             snyk monitor --file=vprofile-project/pom.xml
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        





